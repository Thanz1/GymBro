name: gymbro_single

services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sql_server_gymbro_single
    mem_limit: 1024M
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=GymBro@2024Password
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - gymbro_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gymbro_rabbitmq_single
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - gymbro_network

  identity_api:
    build:
      context: .
      dockerfile: GymBro.Identity.API/Dockerfile.single
    image: gymbro-identity:single
    container_name: gymbro_identity_api_single
    restart: always
    depends_on:
      - db
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=GymBro_Identity;User Id=sa;Password=GymBro@2024Password;TrustServerCertificate=True;MultipleActiveResultSets=true
      - RabbitMQ__HostName=rabbitmq
    ports:
      - "7011:8080"
    networks:
      - gymbro_network

  product_api:
    build:
      context: .
      dockerfile: GymBro.Product.API/Dockerfile.single
    image: gymbro-product:single
    container_name: gymbro_product_api_single
    restart: always
    depends_on:
      - db
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=GymBro_Product;User Id=sa;Password=GymBro@2024Password;TrustServerCertificate=True;MultipleActiveResultSets=true
      - RabbitMQ__HostName=rabbitmq
    ports:
      - "7012:8080"
    networks:
      - gymbro_network

  order_api:
    build:
      context: .
      dockerfile: GymBro.Order.API/Dockerfile.single
    image: gymbro-order:single
    container_name: gymbro_order_api_single
    restart: always
    depends_on:
      - db
      - rabbitmq
      - product_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=GymBro_Order;User Id=sa;Password=GymBro@2024Password;TrustServerCertificate=True;MultipleActiveResultSets=true
      - RabbitMQ__HostName=rabbitmq
      - ServiceUrls__ProductApi=http://product_api:8080
    ports:
      - "7013:8080"
    networks:
      - gymbro_network

  gateway:
    build:
      context: .
      dockerfile: GymBro.Gateway/Dockerfile.single
    image: gymbro-gateway:single
    container_name: gymbro_gateway_single
    restart: always
    depends_on:
      - identity_api
      - product_api
      - order_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8001:8080"
    networks:
      - gymbro_network

  gymbro_web:
    build:
      context: .
      dockerfile: GymBro.Web/Dockerfile.single
    image: gymbro-web:single
    container_name: gymbro_web_single
    restart: always
    depends_on:
      - gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ServiceUrls__ProductApi=http://product_api:8080
      - ServiceUrls__OrderApi=http://order_api:8080
      - ServiceUrls__IdentityApi=http://identity_api:8080
    ports:
      - "5001:8080"
    networks:
      - gymbro_network

networks:
  gymbro_network:
    driver: bridge

volumes:
  sql_data:
