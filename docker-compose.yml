version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sql_server_gymbro_multi
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=GymBro@2024Password
    ports:
      - "1433:1433"
    volumes:
      - sql_data_multi:/var/opt/mssql # Đổi tên volume để không đụng bản single
    networks:
      - gymbro_network_multi

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gymbro_rabbitmq_multi
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - gymbro_network_multi

  identity_api:
    build:
      context: .
      dockerfile: GymBro.Identity.API/Dockerfile 
    image: gymbro-identity:multi
    container_name: gymbro_identity_api_multi
    restart: always
    depends_on:
      - db
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=GymBro_Identity;User Id=sa;Password=GymBro@2024Password;TrustServerCertificate=True;MultipleActiveResultSets=true
      - RabbitMQ__HostName=rabbitmq
    ports:
      - "7001:8080"
    networks:
      - gymbro_network_multi

  product_api:
    build:
      context: .
      dockerfile: GymBro.Product.API/Dockerfile
    image: gymbro-product:multi
    container_name: gymbro_product_api_multi
    restart: always
    depends_on:
      - db
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=GymBro_Product;User Id=sa;Password=GymBro@2024Password;TrustServerCertificate=True;MultipleActiveResultSets=true
      - RabbitMQ__HostName=rabbitmq
    ports:
      - "7002:8080"
    networks:
      - gymbro_network_multi

  order_api:
    build:
      context: .
      dockerfile: GymBro.Order.API/Dockerfile
    image: gymbro-order:multi
    container_name: gymbro_order_api_multi
    restart: always
    depends_on:
      - db
      - rabbitmq
      - product_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=GymBro_Order;User Id=sa;Password=GymBro@2024Password;TrustServerCertificate=True;MultipleActiveResultSets=true
      - RabbitMQ__HostName=rabbitmq
      - ServiceUrls__ProductApi=http://product_api:8080
    ports:
      - "7003:8080"
    networks:
      - gymbro_network_multi

  gateway:
    build:
      context: .
      dockerfile: GymBro.Gateway/Dockerfile
    image: gymbro-gateway:multi
    container_name: gymbro_gateway_multi
    restart: always
    depends_on:
      - identity_api
      - product_api
      - order_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8000:8080"
    networks:
      - gymbro_network_multi

  gymbro_web:
    build:
      context: .
      dockerfile: GymBro.Web/Dockerfile
    image: gymbro-web:multi
    container_name: gymbro_web_multi
    restart: always
    depends_on:
      - gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ServiceUrls__ProductApi=http://product_api:8080
      - ServiceUrls__OrderApi=http://order_api:8080
      - ServiceUrls__IdentityApi=http://identity_api:8080
    ports:
      - "5000:8080"
    networks:
      - gymbro_network_multi

networks:
  gymbro_network_multi:
    driver: bridge

volumes:
  sql_data_multi: