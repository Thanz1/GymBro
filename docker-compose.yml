version: '3.8'

services:
  # 1. CƠ SỞ DỮ LIỆU
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sql_server_gymbro
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=GymBro@2024Password
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - gymbro_network

  # 2. HÀNG ĐỢI THÔNG ĐIỆP (BẤT ĐỒNG BỘ)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: gymbro_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - gymbro_network

  # ==========================================
  # 3. CÁC MICROSERVICES LÕI
  # ==========================================
  
  # A. Identity API (Port 7001)
  identity_api:
    build:
      context: .
      dockerfile: GymBro.Identity.API/Dockerfile.multi
    container_name: gymbro_identity_api
    depends_on:
      - db
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=GymBro_Identity;User Id=sa;Password=GymBro@2024Password;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "7001:8080"
    networks:
      - gymbro_network

  # B. Product API (Port 7002) - DỊCH VỤ DÙNG ĐỂ THÍ NGHIỆM ĐO LƯỜNG
  product_api:
    build:
      context: .
      # CHỖ ĐỔI KỊCH BẢN NGHIÊN CỨU:
      # Thay đổi giữa Dockerfile.single và Dockerfile.multi ở đây
      dockerfile: GymBro.Product.API/Dockerfile.multi 
    container_name: gymbro_product_api
    depends_on:
      - db
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=GymBro_Product;User Id=sa;Password=GymBro@2024Password;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "7002:8080"
    networks:
      - gymbro_network

  # C. Order API (Port 7003)
  order_api:
    build:
      context: .
      dockerfile: GymBro.Order.API/Dockerfile.multi
    container_name: gymbro_order_api
    depends_on:
      - db
      - rabbitmq
      - product_api # Cần Product API chạy trước để HTTP Client gọi đồng bộ sang
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=GymBro_Order;User Id=sa;Password=GymBro@2024Password;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "7003:8080"
    networks:
      - gymbro_network

  # 4. API GATEWAY (Port 8000)
  gateway:
    build:
      context: .
      dockerfile: GymBro.Gateway/Dockerfile
    container_name: gymbro_gateway
    depends_on:
      - identity_api
      - product_api
      - order_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8000:8080"
    networks:
      - gymbro_network

  # 5. GIAO DIỆN WEB (FRONT-END)
  gymbro_web:
    build:
      context: .
      dockerfile: GymBro.Web/Dockerfile
    container_name: gymbro_web
    depends_on:
      - gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
    networks:
      - gymbro_network

networks:
  gymbro_network:
    driver: bridge

volumes:
  sql_data: